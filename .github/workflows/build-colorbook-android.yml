name: Build Color Book Generator Android APK
on:
  push:
    branches:
      - colorbook-android-build-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: android-colorbook
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorBookGenerator-Android-debug
          path: android-colorbook/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
