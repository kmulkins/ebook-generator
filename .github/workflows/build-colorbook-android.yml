name: Build Color Book Generator Android APK
on:
  push:
    branches:
      - colorbook-android-build-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools
        run: |
          mkdir -p "$RUNNER_TEMP/android-sdk/cmdline-tools"
          curl -fLsS https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/commandlinetools.zip"
          unzip -q "$RUNNER_TEMP/commandlinetools.zip" -d "$RUNNER_TEMP/android-sdk/cmdline-tools"
          mv "$RUNNER_TEMP/android-sdk/cmdline-tools/cmdline-tools" "$RUNNER_TEMP/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: android-colorbook
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorBookGenerator-Android-test2
          path: android-colorbook/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  emulator-smoke-test:
    needs: build-debug-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download test APK
        uses: actions/download-artifact@v4
        with:
          name: ColorBookGenerator-Android-test2
          path: apk
      - name: Start on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install apk/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.kevinmulkins.colorbookgenerator.test2/com.kevinmulkins.colorbookgenerator.MainActivity
            sleep 5
            adb logcat -d -b crash > crashes.txt
            if grep -E "FATAL EXCEPTION|com.kevinmulkins.colorbookgenerator.test2" crashes.txt; then
              cat crashes.txt
              exit 1
            fi
            adb shell dumpsys activity activities | grep com.kevinmulkins.colorbookgenerator.test2
