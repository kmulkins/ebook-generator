plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kevinmulkins.colorbookgenerator'
    compileSdk 36

    defaultConfig {
        applicationId 'com.kevinmulkins.colorbookgenerator.test2'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.1.0-test'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.10.0'
}
