plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kevinmulkins.colorbookgenerator'
    compileSdk 36

    defaultConfig {
        applicationId 'com.kevinmulkins.colorbookgenerator'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
